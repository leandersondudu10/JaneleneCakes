<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaneleneCakes - Pedido Online</title>
    <style>
        :root {
            --primary: #d81b60;
            --primary-light: #fce4ec;
            --primary-dark: #ad1457;
            --bg-color: #fff5f8;
            --card-bg: #ffffff;
            --text-color: #444444;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            margin: 0;
        }

        .container {
            max-width: 480px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(216, 27, 96, 0.08);
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary);
            margin: 0 0 5px 0;
            font-size: 1.8em;
        }

        p.subtitle {
            font-style: italic;
            color: var(--primary-dark);
            margin: 0 0 15px 0;
            font-size: 0.95em;
        }

        .insta-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #e1306c;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9em;
            background: #fff;
            border: 1px solid #f8bbd0;
            padding: 6px 16px;
            border-radius: 20px;
            gap: 6px;
            transition: all 0.3s;
        }

        .btn-cardapio {
            display: block;
            width: 100%;
            background: var(--primary-light);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px;
            border-radius: var(--border-radius);
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            margin: 15px 0;
            transition: 0.3s;
        }

        label {
            font-weight: 700;
            display: block;
            margin-top: 18px;
            color: #880e4f;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label span.req {
            color: var(--primary);
        }

        select, input {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border: 2px solid #f8bbd0;
            border-radius: var(--border-radius);
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            font-size: 15px;
            background-color: #fff;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(216, 27, 96, 0.1);
        }

        /* Card Selectors */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .card-option {
            border: 2px solid #f8bbd0;
            border-radius: var(--border-radius);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .card-option strong {
            display: block;
            color: var(--primary-dark);
            font-size: 1.05em;
        }

        .card-option span {
            font-size: 0.85em;
            color: #666;
        }

        .card-option.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.15);
        }

        /* Caixa de Resumo */
        .resumo-box {
            background: #fff;
            border: 2px solid var(--primary-light);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .resumo-box h4 {
            margin: 0 0 10px 0;
            color: var(--primary);
            border-bottom: 1px dashed #f8bbd0;
            padding-bottom: 5px;
        }

        .resumo-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #555;
        }

        .total-box {
            background: var(--primary-light);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-top: 20px;
            text-align: center;
            border: 2px dashed var(--primary);
        }

        .total-box span {
            font-size: 1.6em;
            color: var(--primary);
            display: block;
            font-weight: bold;
        }

        .cupcake-box {
            background: #fff0f5;
            border: 2px dashed #f06292;
            padding: 18px;
            border-radius: var(--border-radius);
            margin-top: 15px;
        }

        .termos {
            margin-top: 20px;
            background: #fff;
            border: 1px solid #fce4ec;
            padding: 12px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
        }

        .termos input { width: auto; margin-top: 3px; }
        .termos span { font-size: 0.85em; color: var(--primary); line-height: 1.4; }

        button.btn-whatsapp {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 18px;
            border-radius: var(--border-radius);
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
        }

        .hidden { display: none; }

        /* Modal Galeria */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            overflow-y: auto;
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🎂 JaneleneCakes</h2>
        <p class="subtitle">Confeitaria Artesanal & Afeto 💝</p>
        <a href="https://www.instagram.com/janelenecakes_confeitaria?igsh=ZG02Nzh4ZDd1ZXkx" target="_blank" class="insta-link">
            <span>📸</span> @janelenecakes_confeitaria
        </a>
    </div>

    <button class="btn-cardapio" onclick="abrirModal()">📖 Ver Cardápio & Fotos de Referência</button>

    <label>Seu Nome <span class="req">*</span></label>
    <input type="text" id="nome" placeholder="Ex: Maria Silva">

    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Data <span class="req">*</span></label>
            <input type="date" id="data">
        </div>
        <div style="flex: 1;">
            <label>Hora <span class="req">*</span></label>
            <input type="time" id="hora">
        </div>
    </div>

    <label>Tamanho do Bolo <span class="req">*</span></label>
    <div class="cards-grid">
        <div class="card-option" onclick="selecionarTamanho('100', '12', this)">
            <strong>12 Fatias</strong>
            <span>R$ 100,00</span>
        </div>
        <div class="card-option" onclick="selecionarTamanho('130', '18', this)">
            <strong>18 Fatias</strong>
            <span>R$ 130,00</span>
        </div>
        <div class="card-option" onclick="selecionarTamanho('160', '28', this)">
            <strong>28 Fatias</strong>
            <span>R$ 160,00</span>
        </div>
        <div class="card-option" onclick="selecionarTamanho('200', '40', this)">
            <strong>40 Fatias</strong>
            <span>R$ 200,00</span>
        </div>
    </div>
    <input type="hidden" id="tamanho" value="">

    <div id="divDetalhesBolo">
        <label>Massa do Bolo <span class="req">*</span></label>
        <select id="massa" onchange="atualizarResumo()">
            <option value="">-- Selecione a Massa --</option>
            <option>Baunilha</option>
            <option>Chocolate</option>
            <option>Formigueiro</option>
            <option>Mesclado</option>
            <option>Napolitano</option>
            <option>Red Velvet</option>
        </select>

        <label id="labelRecheio1">Sabor do Recheio <span class="req">*</span></label>
        <select id="recheio1" onchange="calcular(); atualizarResumo();">
            <option value="">-- Selecione o Recheio --</option>
            <option value="0" data-nome="Brigadeiro Branco">Brigadeiro Branco</option>
            <option value="0" data-nome="Brigadeiro Ninho">Brigadeiro Ninho</option>
            <option value="0" data-nome="Brigadeiro Chocolate">Brigadeiro Chocolate</option>
            <option value="7" data-nome="Brigadeiro de Limão">Brigadeiro de Limão (+R$ 7,00)</option>
            <option value="7" data-nome="Brigadeiro de Paçoca">Brigadeiro de Paçoca (+R$ 7,00)</option>
            <option value="7" data-nome="Brigadeiro Oreo">Brigadeiro Oreo (+R$ 7,00)</option>
            <option value="10" data-nome="Brigadeiro de Maracujá">Brigadeiro de Maracujá (+R$ 10,00)</option>
            <option value="12" data-nome="Delícia de Abacaxi">Delícia de Abacaxi (+R$ 12,00)</option>
            <option value="15" data-nome="Delícia de Morango">Delícia de Morango (+R$ 15,00)</option>
        </select>

        <div id="divRecheio2" class="hidden">
            <label>2º Sabor de Recheio (Opcional)</label>
            <select id="recheio2" onchange="calcular(); atualizarResumo();">
                <option value="0" data-nome="Nenhum">-- Apenas 1 Sabor --</option>
                <option value="0" data-nome="Brigadeiro Branco">Brigadeiro Branco</option>
                <option value="0" data-nome="Brigadeiro Ninho">Brigadeiro Ninho</option>
                <option value="0" data-nome="Brigadeiro Chocolate">Brigadeiro Chocolate</option>
                <option value="7" data-nome="Brigadeiro de Limão">Brigadeiro de Limão (+R$ 7,00)</option>
                <option value="7" data-nome="Brigadeiro de Paçoca">Brigadeiro de Paçoca (+R$ 7,00)</option>
                <option value="7" data-nome="Brigadeiro Oreo">Brigadeiro Oreo (+R$ 7,00)</option>
                <option value="10" data-nome="Brigadeiro de Maracujá">Brigadeiro de Maracujá (+R$ 10,00)</option>
                <option value="12" data-nome="Delícia de Abacaxi">Delícia de Abacaxi (+R$ 12,00)</option>
                <option value="15" data-nome="Delícia de Morango">Delícia de Morango (+R$ 15,00)</option>
            </select>
        </div>

        <label>Topo do Bolo <span class="req">*</span></label>
        <select id="topo" onchange="calcular(); atualizarResumo();">
            <option value="">-- Selecione o Topo --</option>
            <option value="0">1. Sem topo</option>
            <option value="0">2. Topo a combinar</option>
        </select>
    </div>

    <!-- Adicionar Cupcakes -->
    <label>Deseja adicionar Cupcakes ao pedido? 🧁</label>
    <select id="desejaCupcake" onchange="toggleCupcakes(); calcular(); atualizarResumo();">
        <option value="nao">Não</option>
        <option value="sim">Sim</option>
    </select>

    <div id="divCupcakes" class="cupcake-box hidden">
        <label style="margin-top:0;">Quantidade de Cupcakes:</label>
        <select id="qtdCupcake" onchange="calcular(); atualizarResumo();">
            <option value="6">6 Unidades</option>
            <option value="10">10 Unidades</option>
            <option value="12">12 Unidades</option>
            <option value="15">15 Unidades</option>
            <option value="20">20 Unidades</option>
            <option value="24">24 Unidades</option>
        </select>

        <label>Topo no Cupcake?</label>
        <select id="topoCupcake" onchange="calcular(); atualizarResumo();">
            <option value="6">Sem topo (R$ 6,00/un)</option>
            <option value="7">Com topo (R$ 7,00/un)</option>
        </select>

        <label>Massa do Cupcake:</label>
        <select id="massaCupcake" onchange="atualizarResumo()">
            <option value="">-- Selecione a Massa --</option>
            <option>Baunilha</option>
            <option>Chocolate</option>
            <option>Formigueiro</option>
        </select>

        <label>Recheio do Cupcake:</label>
        <select id="recheioCupcake" onchange="atualizarResumo()">
            <option value="">-- Selecione o Recheio --</option>
            <option>Brigadeiro Branco</option>
            <option>Brigadeiro de Chocolate</option>
        </select>
    </div>

    <label>Forma de Pagamento <span class="req">*</span></label>
    <select id="pagamento" onchange="exibirOpcoesCredito()">
        <option value="">-- Selecione o Pagamento --</option>
        <option value="Pix">Pix</option>
        <option value="Débito">Cartão de Débito</option>
        <option value="Crédito">Cartão de Crédito</option>
    </select>

    <div id="divParcelas" class="hidden">
        <label>Quantidade de Parcelas:</label>
        <select id="parcelas">
            <option value="1x">1x (à vista no crédito)</option>
            <option value="2x">2x</option>
            <option value="3x">3x</option>
            <option value="4x">4x</option>
            <option value="5x">5x</option>
            <option value="6x">6x</option>
            <option value="7x">7x</option>
            <option value="8x">8x</option>
            <option value="9x">9x</option>
            <option value="10x">10x</option>
        </select>
    </div>

    <!-- Resumo Vivo -->
    <div class="resumo-box">
        <h4>📋 Resumo do Seu Pedido:</h4>
        <div class="resumo-item"><span>Bolo:</span> <strong id="resBolo">Não selecionado</strong></div>
        <div class="resumo-item"><span>Recheio(s):</span> <strong id="resRecheio">-</strong></div>
        <div class="resumo-item"><span>Cupcakes:</span> <strong id="resCupcake">Não</strong></div>
    </div>

    <div class="total-box">
        VALOR TOTAL: R$ <span id="valorTotal">0,00</span>
        <small style="color: #ad1457; font-weight: bold; display: block; margin-top: 5px;">
            Sinal para Reserva (50%): R$ <span id="valorSinal">0,00</span>
        </small>
    </div>

    <label class="termos">
        <input type="checkbox" id="aceiteTermos">
        <span>Estou ciente de que os bolos possuem suporte interno e devem ser removidos ao cortar. ⚠️</span>
    </label>

    <button class="btn-whatsapp" onclick="enviarWhatsApp()">Confirmar Pedido via WhatsApp 📱</button>
</div>

<!-- Modal com Imagem do Cardápio -->
<div id="modalCardapio" class="modal" onclick="fecharModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" src="cardapio.jpeg" alt="Cardápio JaneleneCakes">
</div>

<script>
    document.getElementById('data').min = new Date().toISOString().split("T")[0];

    let fatiasSelecionadas = "";

    function selecionarTamanho(valor, fatias, elemento) {
        document.querySelectorAll('.card-option').forEach(c => c.classList.remove('selected'));
        elemento.classList.add('selected');
        document.getElementById('tamanho').value = valor;
        fatiasSelecionadas = fatias;

        const divRecheio2 = document.getElementById('divRecheio2');
        const labelR1 = document.getElementById('labelRecheio1');

        if (valor === "100") {
            divRecheio2.classList.add('hidden');
            document.getElementById('recheio2').value = "0";
            labelR1.innerHTML = 'Sabor do Recheio <span class="req">*</span>';
        } else {
            divRecheio2.classList.remove('hidden');
            labelR1.innerHTML = '1º Sabor de Recheio <span class="req">*</span>';
        }

        calcular();
        atualizarResumo();
    }

    function toggleCupcakes() {
        const querCupcake = document.getElementById('desejaCupcake').value;
        const divCupcakes = document.getElementById('divCupcakes');
        if (querCupcake === "sim") {
            divCupcakes.classList.remove('hidden');
        } else {
            divCupcakes.classList.add('hidden');
        }
    }

    function exibirOpcoesCredito() {
        const pag = document.getElementById('pagamento').value;
        const divParcelas = document.getElementById('divParcelas');
        if (pag === "Crédito") { divParcelas.classList.remove('hidden'); } 
        else { divParcelas.classList.add('hidden'); }
    }

    function calcular() {
        let valTamanho = document.getElementById('tamanho').value;
        let base = valTamanho !== "" ? parseFloat(valTamanho) : 0;
        let r1 = parseFloat(document.getElementById('recheio1').value || 0);
        let r2 = parseFloat(document.getElementById('recheio2').value || 0);
        
        let valorCupcakes = 0;
        if (document.getElementById('desejaCupcake').value === "sim") {
            let qtd = parseInt(document.getElementById('qtdCupcake').value || 0);
            let precoUnitario = parseFloat(document.getElementById('topoCupcake').value || 0);
            valorCupcakes = qtd * precoUnitario;
        }

        let total = base + r1 + r2 + valorCupcakes;
        document.getElementById('valorTotal').innerText = total.toFixed(2).replace('.', ',');
        document.getElementById('valorSinal').innerText = (total / 2).toFixed(2).replace('.', ',');
    }

    function atualizarResumo() {
        const tam = document.getElementById('tamanho').value;
        document.getElementById('resBolo').innerText = tam ? `${fatiasSelecionadas} Fatias` : 'Não selecionado';

        const r1Select = document.getElementById('recheio1');
        const r1Nome = r1Select.options[r1Select.selectedIndex]?.getAttribute('data-nome') || '';
        const r2Select = document.getElementById('recheio2');
        const r2Nome = r2Select.options[r2Select.selectedIndex]?.getAttribute('data-nome') || '';

        if (r1Nome) {
            let textoR = r1Nome;
            if (fatiasSelecionadas !== "12" && r2Nome && r2Nome !== "Nenhum") {
                textoR += ` + ${r2Nome}`;
            }
            document.getElementById('resRecheio').innerText = textoR;
        } else {
            document.getElementById('resRecheio').innerText = '-';
        }

        const querCupcake = document.getElementById('desejaCupcake').value;
        if (querCupcake === "sim") {
            const qtd = document.getElementById('qtdCupcake').value;
            document.getElementById('resCupcake').innerText = `${qtd} Unidades`;
        } else {
            document.getElementById('resCupcake').innerText = 'Não';
        }
    }

    function abrirModal() { document.getElementById('modalCardapio').style.display = "block"; }
    function fecharModal() { document.getElementById('modalCardapio').style.display = "none"; }

    function enviarWhatsApp() {
        const nome = document.getElementById('nome').value;
        const data = document.getElementById('data').value;
        const hora = document.getElementById('hora').value;
        const tam = document.getElementById('tamanho').value;
        const massa = document.getElementById('massa').value;
        const recheio1 = document.getElementById('recheio1').value;
        const topo = document.getElementById('topo').value;
        const pag = document.getElementById('pagamento').value;
        const aceite = document.getElementById('aceiteTermos').checked;

        const querCupcake = document.getElementById('desejaCupcake').value;
        const massaCupcake = document.getElementById('massaCupcake').value;
        const recheioCupcake = document.getElementById('recheioCupcake').value;

        if(!nome || !data || !hora || !pag) { 
            alert("Por favor, preencha Nome, Data, Hora e Forma de Pagamento!"); 
            return; 
        }

        if(!tam && querCupcake === "nao") {
            alert("Escolha um tamanho de bolo ou marque 'Sim' nos cupcakes!");
            return;
        }

        if(tam !== "") {
            if(!massa || recheio1 === "" || topo === "") {
                alert("Preencha todos os campos do bolo (Massa, Recheio e Topo)!");
                return;
            }
        }

        if (querCupcake === "sim" && (!massaCupcake || !recheioCupcake)) {
            alert("Selecione a Massa e Recheio do Cupcake!");
            return;
        }

        if(!aceite) {
            alert("Por favor, confirme que está ciente sobre as hastes internas de sustentação.");
            return;
        }

        let fatias = "Não solicitado";
        let recheiosTexto = "Nenhum";
        let topoTexto = "Nenhum";

        if(tam !== "") {
            fatias = fatiasSelecionadas + " fatias";
            const r1Nome = document.getElementById('recheio1').options[document.getElementById('recheio1').selectedIndex].getAttribute('data-nome');
            const r2Element = document.getElementById('recheio2');
            const r2Nome = r2Element.options[r2Element.selectedIndex].getAttribute('data-nome');
            topoTexto = document.getElementById('topo').options[document.getElementById('topo').selectedIndex].text;

            recheiosTexto = r1Nome;
            if (fatias !== "12 fatias" && r2Nome !== "Nenhum") { recheiosTexto += ` e ${r2Nome}`; }
        }

        const parcelas = document.getElementById('parcelas').value;
        const total = document.getElementById('valorTotal').innerText;

        let formaPagamentoFinal = pag;
        if (pag === "Crédito") { formaPagamentoFinal += ` (${parcelas})`; }

        let textoCupcake = "Não";
        if (querCupcake === "sim") {
            const qtdCup = document.getElementById('qtdCupcake').value;
            const comTopo = document.getElementById('topoCupcake').value === "7" ? "Com topo" : "Sem topo";
            textoCupcake = `${qtdCup} un. (${comTopo} | Massa: ${massaCupcake} | Recheio: ${recheioCupcake})`;
        }

        let dataBR = data.split('-').reverse().join('/');
        let numeroFone = "558597800232"; 
        
        let mensagem = `Olá Jane! Novo pedido solicitado:%0A%0A` +
            `👤 *Cliente:* ${nome}%0A` +
            `📅 *Data:* ${dataBR} às ${hora}%0A` +
            `🎂 *Bolo:* ${fatias}%0A` +
            (tam !== "" ? `🍞 *Massa Bolo:* ${massa}%0A🍫 *Recheio Bolo:* ${recheiosTexto}%0A🎀 *Topo:* ${topoTexto}%0A` : "") +
            `🧁 *Cupcakes:* ${textoCupcake}%0A%0A` +
            `💵 *Pagamento:* ${formaPagamentoFinal}%0A` +
            `💰 *Valor Total:* R$ ${total}%0A` +
            `💳 *Entrada (50%):* R$ ${document.getElementById('valorSinal').innerText}%0A%0A` +
            `✅ *Ciente dos suportes internos.*`;

        window.open(`https://wa.me/${numeroFone}?text=${mensagem}`, '_blank');
    }
</script>

</body>
</html>
